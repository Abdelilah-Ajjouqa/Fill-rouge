services:
  mongo:
    image: mongo:7
    container_name: fitmanager-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fitmanager

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitmanager-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/fitmanager
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      PORT: 3000
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitmanager-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
