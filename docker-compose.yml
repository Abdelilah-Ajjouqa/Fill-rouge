services:
  mongo:
    image: mongo:7
    container_name: fitmanager-mongo
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fitmanager

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitmanager-backend
    restart: unless-stopped
    ports:
      - "3201:3000"
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/FitManager
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      PORT: 3000
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitmanager-frontend
    restart: unless-stopped
    ports:
      - "3200:80"
    command: npm run dev -- --host 0.0.0.0 --port 80
    environment:
      - VITE_API_BASE_URL=http://localhost:3201
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
